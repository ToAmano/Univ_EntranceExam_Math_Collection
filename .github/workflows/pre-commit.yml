name: Pre-commit (tex-fmt)

on:
  pull_request:
    paths:
      - '**/*.tex'
      - '.pre-commit-config.yaml'
      - 'tex-fmt.toml'
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '.pre-commit-config.yaml'
      - 'tex-fmt.toml'

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: pre-commit/action@v3.0.1
