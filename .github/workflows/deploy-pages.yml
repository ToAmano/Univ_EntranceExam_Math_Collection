name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh the build-time Issue index even when no source files change.
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # generate_news.py walks the full git history of src/**/solution.tex;
          # a shallow clone would only see the most recent commit.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pandoc and TikZ dependencies
        # Avoid slow ec2.archive.ubuntu.com mirrors and unneeded TeX/JRE recommends.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          pkgs=(
            pandoc poppler-utils ghostscript librsvg2-bin dvisvgm lmodern
            texlive-extra-utils texlive-latex-base texlive-latex-recommended
            texlive-latex-extra texlive-fonts-recommended texlive-luatex
            texlive-pictures texlive-science texlive-lang-japanese
          )
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::http::Pipeline-Depth=0
          )

          install_from_current_mirror() {
            sudo apt-get update "${apt_opts[@]}" &&
            sudo timeout 480 env DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends --download-only "${apt_opts[@]}" "${pkgs[@]}" &&
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends "${apt_opts[@]}" "${pkgs[@]}"
          }

          if [ -f /etc/apt/apt-mirrors.txt ]; then
            . /etc/os-release
            orig_mirrors="$(awk '/^https?:\/\//{print $1}' /etc/apt/apt-mirrors.txt || true)"
            candidates=()
            # Keep the runner's default mirror first unless it is an ec2 mirror (prone to stalling).
            while IFS= read -r m; do
              [ -n "$m" ] && [[ "$m" != *ec2.archive.ubuntu.com* ]] && candidates+=("$m")
            done <<< "$orig_mirrors"

            # Benchmark reliable mirrors and append any remaining originals as last resort.
            probe_list=(
              http://azure.archive.ubuntu.com/ubuntu
              http://mirrors.edge.kernel.org/ubuntu
              http://us.archive.ubuntu.com/ubuntu
              http://archive.ubuntu.com/ubuntu
            )
            ranked_probes="$(
              for m in "${probe_list[@]}"; do
                spd="$(curl -fsSL --connect-timeout 3 --max-time 5 -o /dev/null -w '%{speed_download}' "${m}/dists/${VERSION_CODENAME}/InRelease" 2>/dev/null)" || spd=0
                if [ "$spd" != "0" ] && [ "$spd" != "0.000" ]; then
                  printf '%s %s\n' "$spd" "$m"
                fi
              done | sort -rn | awk '{print $2}'
            )"
            while IFS= read -r m; do
              [ -n "$m" ] && candidates+=("$m")
            done <<< "$ranked_probes"
            while IFS= read -r m; do
              [ -n "$m" ] && candidates+=("$m")
            done <<< "$orig_mirrors"

            # Deduplicate while preserving priority order.
            unique_candidates=()
            for m in "${candidates[@]:-}"; do
              [ -z "$m" ] && continue
              seen=0
              for u in "${unique_candidates[@]:-}"; do
                [ "$u" = "$m" ] && seen=1 && break
              done
              [ "$seen" -eq 0 ] && unique_candidates+=("$m")
            done

            installed=0
            for m in "${unique_candidates[@]:-}"; do
              [ -z "$m" ] && continue
              echo "Trying Ubuntu apt mirror: $m"
              printf '%s\n' "$m" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              if install_from_current_mirror; then
                installed=1
                break
              fi
              echo "::warning::apt failed or timed out on mirror $m; trying next mirror..."
            done
            [ "$installed" -eq 1 ]
          else
            install_from_current_mirror
          fi

      - name: Run Tex to MD conversion
        timeout-minutes: 40
        run: |
          python3 -m pip install TexSoup pypandoc pyyaml Pillow
          python3 scratch/tex_to_md.py

      - name: Restore generated problem OGP cards
        uses: actions/cache@v4
        with:
          path: web/public/ogp/problems
          key: problem-ogp-${{ runner.os }}-${{ hashFiles('src/**/problem.tex', 'scratch/generate_problem_ogp.py') }}
          restore-keys: problem-ogp-${{ runner.os }}-

      - name: Generate changed problem OGP cards
        run: python3 scratch/generate_problem_ogp.py

      - name: Generate news feed from git history
        run: python3 scratch/generate_news.py

      - name: Export validated problem Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scratch/sync_issue_labels.py --repo "$GITHUB_REPOSITORY" --export web/src/data/issues-by-problem.json

      - name: Generate solution line metrics
        run: python3 scratch/generate_solution_metrics.py

      - name: Generate problem and solution reasoning metrics
        run: python3 scratch/generate_reasoning_metrics.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: cd web && npm ci

      - name: Test Issue mapping
        run: cd web && npm test

      - name: Build Astro site
        timeout-minutes: 15
        # ubuntu-latest ランナーの物理メモリ(約7GB)に収まる範囲で V8 のヒープ上限を
        # 引き上げる。ページ数が増えるにつれてデフォルト上限では
        # "JavaScript heap out of memory" で稀に落ちるようになったため
        # （2026-08-30 に発生、再実行では成功した一時的な事象）。
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: cd web && npm run build

      - name: Check Pages artifact size
        run: python3 scratch/check_site_size.py web/dist

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "Artifact github-pages visible after attempt $i (total_count=$count)"
              exit 0
            fi
            echo "Attempt $i: github-pages artifact not visible yet; retrying in 2s..."
            sleep 2
          done
          echo "::warning::Timed out waiting for github-pages artifact metadata after 60s; proceeding to deploy-pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
