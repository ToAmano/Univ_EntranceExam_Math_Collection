name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh the build-time Issue index even when no source files change.
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # generate_news.py walks the full git history of src/**/solution.tex;
          # a shallow clone would only see the most recent commit.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pandoc and TikZ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils mupdf-tools ghostscript librsvg2-bin texlive-extra-utils texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-luatex texlive-pictures texlive-science texlive-lang-japanese

      - name: Run Tex to MD conversion
        run: |
          python3 -m pip install TexSoup pypandoc pyyaml Pillow
          python3 scratch/tex_to_md.py

      - name: Restore generated problem OGP cards
        uses: actions/cache@v4
        with:
          path: web/public/ogp/problems
          key: problem-ogp-${{ runner.os }}-${{ hashFiles('src/**/problem.tex', 'scratch/generate_problem_ogp.py') }}
          restore-keys: problem-ogp-${{ runner.os }}-

      - name: Generate changed problem OGP cards
        run: python3 scratch/generate_problem_ogp.py

      - name: Generate news feed from git history
        run: python3 scratch/generate_news.py

      - name: Export validated problem Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scratch/sync_issue_labels.py --repo "$GITHUB_REPOSITORY" --export web/src/data/issues-by-problem.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: cd web && npm ci

      - name: Test Issue mapping
        run: cd web && npm test

      - name: Build Astro site
        # ubuntu-latest ランナーの物理メモリ(約7GB)に収まる範囲で V8 のヒープ上限を
        # 引き上げる。ページ数が増えるにつれてデフォルト上限では
        # "JavaScript heap out of memory" で稀に落ちるようになったため
        # （2026-08-30 に発生、再実行では成功した一時的な事象）。
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: cd web && npm run build

      - name: Check Pages artifact size
        run: python3 scratch/check_site_size.py web/dist

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
