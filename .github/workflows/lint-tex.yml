name: Lint LaTeX Style

on:
  pull_request:
    paths:
      - 'src/**/*.tex'
  push:
    branches:
      - main
    paths:
      - 'src/**/*.tex'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff against the base/previous commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Determine changed solution.tex files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "Base commit $BASE not available (e.g. first push to branch); falling back to HEAD^."
            BASE=$(git rev-parse "$HEAD^" 2>/dev/null || echo "$HEAD")
          fi

          # problem.tex (the original exam statement) is intentionally out of
          # scope -- it's source text, not authored solution prose, so rules
          # like "figures need a \caption" don't apply the same way.
          git diff --diff-filter=ACMR --name-only "$BASE" "$HEAD" \
            | grep -E '(^|/)solution\.tex$' > changed_files.txt || true

          echo "Changed solution.tex files:"
          cat changed_files.txt

      - name: Run LaTeX style lint on changed files
        run: |
          if [ -s changed_files.txt ]; then
            python3 scratch/lint_latex_style.py $(cat changed_files.txt)
          else
            echo "No solution.tex changes to lint."
          fi
