name: _probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: System info
        run: |
          echo "CPU cores: $(nproc)"
          echo "---"
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "---"
          free -h
          echo "---"
          df -h /
