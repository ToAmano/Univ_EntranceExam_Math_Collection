name: Build PDF Books

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - { univ: titech, cat: kouki }
          - { univ: titech, cat: zenki }
          - { univ: utokyo, cat: kouki }
          - { univ: utokyo, cat: zenki }
          - { univ: ukyoto, cat: kouki }
          - { univ: ukyoto, cat: zenki }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            texlive-lang-japanese texlive-luatex \
            texlive-latex-extra texlive-latex-recommended \
            texlive-pictures texlive-science texlive-fonts-extra \
            latexmk

      - name: Build namespaced PDF
        run: >-
          python3 scratch/build_pdf_book.py
          ${{ matrix.target.univ }}/${{ matrix.target.cat }}
          --output dist-pdf/${{ matrix.target.univ }}_${{ matrix.target.cat }}.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.univ }}_${{ matrix.target.cat }}
          path: dist-pdf/${{ matrix.target.univ }}_${{ matrix.target.cat }}.pdf

  release:
    needs: build-pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all PDFs
        uses: actions/download-artifact@v4
        with:
          path: pdfs

      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find pdfs -name "*.pdf" -exec cp {} release/ \;
          ls -la release

      - name: Create Release and Upload PDFs
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
