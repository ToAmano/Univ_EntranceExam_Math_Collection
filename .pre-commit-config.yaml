repos:
  - repo: https://github.com/WGUNDERWOOD/tex-fmt
    rev: v0.5.7
    hooks:
      - id: tex-fmt
        # solution.tex / problem.tex (per-question answers and exam
        # statements) and handwritten_tex.tex (the per-year transcription
        # staging file, see AGENT.md section 8) are the hand-authored LaTeX
        # in this repo. main.tex is regenerated by
        # scratch/generate_main_tex.py and intentionally excluded: hand
        # -formatting it would just be clobbered on the next regeneration.
        files: '(^|/)(solution|problem|handwritten_tex)\.tex$'
  - repo: local
    hooks:
      - id: lint-latex-style
        name: Lint LaTeX style (AGENT.md 8.3.6)
        description: >-
          Mirrors .github/workflows/lint-tex.yml locally: only staged
          solution.tex files are checked (problem.tex is source text, not
          authored solution prose, so it's out of scope here too). The
          existing corpus has a large pre-existing backlog (see AGENT.md
          6節), so this only ratchets on files you actually touch.
        entry: python3 scratch/lint_latex_style.py
        language: system
        files: '(^|/)solution\.tex$'
