# tex-fmt configuration for this repository.
# See: https://github.com/WGUNDERWOOD/tex-fmt
#
# wrap = false: this project prefers manually-chosen line breaks (at logical
# &=/\\ points, see scratch/lint_latex_style.py's long-align-line warning)
# over tex-fmt's automatic 80-column wrapping, which can cut math expressions
# at arbitrary points.
wrap = false
tabsize = 2
